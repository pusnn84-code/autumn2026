<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 가을빛축제 | 당신을 초대합니다</title>
<meta name="description" content="10월 25일 주일, 삼덕교회 2026 가을빛축제에 당신을 초대합니다.">
<meta property="og:title" content="2026 가을빛축제">
<meta property="og:description" content="10월 25일 주일 · 삼덕교회 · 당신을 초대합니다">
<meta property="og:image" content="https://pusnn84-code.github.io/autumn2026/123.jpg">
<meta property="og:url" content="https://pusnn84-code.github.io/autumn2026/">
<meta property="og:type" content="website">
<style>
html,body{margin:0;padding:0;background:#f5ead7;}
.invitation{position:relative;width:100%;max-width:600px;margin:0 auto;}
.invitation img{display:block;width:100%;height:auto;}
.share-button{position:absolute;bottom:2.4%;height:2.3%;border:0;padding:0;background:transparent;cursor:pointer;z-index:10;border-radius:14px;}
.general-share{left:26.5%;width:33%;}
.kakao-share{left:60.5%;width:12%;}
.share-button:focus-visible{outline:3px solid #49300e;outline-offset:3px;}
#share-status{text-align:center;margin:0;padding:0 16px;color:#68451c;font:16px sans-serif;}
#share-status:not(:empty){padding:16px;}
</style>
</head>
<body>
<main class="invitation">
<img src="/autumn2026/123.jpg" width="942" height="5031" alt="2026 가을빛축제 초대장. 10월 25일 주일, 삼덕교회. 대구광역시 중구 공평로4길 11. 주일예배 오전 7:30, 9:30, 11:30. 문의 053.430.9191.">
<button class="share-button general-share" type="button" onclick="shareInvitation()" aria-label="초대장 공유하기"></button>
<button class="share-button kakao-share" type="button" onclick="shareKakao()" aria-label="카카오톡으로 초대장 공유하기"></button>
</main>
<p id="share-status" role="status" aria-live="polite"></p>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"></script>
<script>
const invitationUrl='https://pusnn84-code.github.io/autumn2026/';
const invitationTitle='2026 가을빛축제';
const invitationText='10월 25일 주일 · 삼덕교회 · 당신을 초대합니다';
if(window.Kakao && !Kakao.isInitialized()) Kakao.init('af0e7ae3c1ccaab67503d0dc2a108cd2');
function statusMessage(text){document.getElementById('share-status').textContent=text;}
async function shareInvitation(){
  if(navigator.share){
    try{await navigator.share({title:invitationTitle,text:invitationText,url:invitationUrl});return;}
    catch(error){if(error.name==='AbortError')return;}
  }
  try{await navigator.clipboard.writeText(invitationUrl);statusMessage('초대장 주소를 복사했습니다. 카카오톡이나 문자에 붙여넣어 주세요.');}
  catch(error){statusMessage('초대장 주소: '+invitationUrl);}
}
function shareKakao(){
  if(!window.Kakao || !Kakao.isInitialized()){statusMessage('카카오톡 공유를 불러오지 못했습니다. 공유하기 버튼으로 주소를 공유해 주세요.');return;}
  try{Kakao.Share.sendDefault({
    objectType:'feed',
    content:{title:invitationTitle,description:invitationText,imageUrl:'https://pusnn84-code.github.io/autumn2026/123.jpg',link:{mobileWebUrl:invitationUrl,webUrl:invitationUrl}},
    buttons:[{title:'초대장 보기',link:{mobileWebUrl:invitationUrl,webUrl:invitationUrl}}]
  });}
  catch(error){statusMessage('카카오톡 공유를 열지 못했습니다. 공유하기 버튼으로 주소를 공유해 주세요.');}
}
</script>
</body>
</html>
