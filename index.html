<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026 가을빛음악회 | 인생, 노래가 되다</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    .invitation {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .invitation img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 초대장 오른쪽 아래 TALK 아이콘 클릭 영역 */
    .kakao-share {
      position: absolute;
      right: 1%;
      bottom: 0.3%;
      width: 18%;
      height: 5%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

<body>

  <main class="invitation">

    <img
      src="/autumn2026/invitation.jpg"
      alt="2026 가을빛음악회 초대장"
    >

    <button
      class="kakao-share"
      type="button"
      onclick="shareKakao()"
      aria-label="카카오톡으로 초대장 공유하기">
    </button>

  </main>

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"></script>

  <script>

    Kakao.init('af0e7ae3c1ccaab67503d0dc2a108cd2');

    function shareKakao() {

      Kakao.Share.sendDefault({

        objectType: 'feed',

        content: {
          title: '2026 가을빛음악회',
          description: '인생, 노래가 되다',
          imageUrl: 'https://pusnn84-code.github.io/autumn2026/invitation.jpg',

          link: {
            mobileWebUrl: 'https://pusnn84-code.github.io/autumn2026/',
            webUrl: 'https://pusnn84-code.github.io/autumn2026/'
          }
        },

        buttons: [
          {
            title: '초대장 보기',
            link: {
              mobileWebUrl: 'https://pusnn84-code.github.io/autumn2026/',
              webUrl: 'https://pusnn84-code.github.io/autumn2026/'
            }
          }
        ]

      });

    }

  </script>

</body>
</html>
